name: THH security checks
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'
  push:
    branches: [integration/thh-unified-baseline-v1]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets (redacted)
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --gitleaks-ignore-path /repo --redact=100 --no-banner --verbose
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit locked dependencies
        run: npm audit --package-lock-only --audit-level=low
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static security analysis
        run: |
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.120.0 semgrep scan --config p/javascript --config p/typescript --config p/secrets --severity ERROR --error --strict --metrics off --quiet /src
