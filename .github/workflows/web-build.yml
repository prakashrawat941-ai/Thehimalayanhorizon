# Checks the Next.js app (web/) on every pull request: production build.
name: Web build check
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Smoke test pages (reads live public data only)
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          fail=0
          for p in / /destinations /villages /experiences /itineraries /homestays /village-tours /workspaces /contact /faq /about /our-story /blog /gallery /search /login /plan /cab /offline /sitemap.xml /robots.txt /manifest.webmanifest /sw.js /no-such-page /account /account/bookings /account/cab /account/trips /account/saved /account/reviews /account/notifications /account/profile; do
            code=$(curl -s -o /tmp/out.html -w "%{http_code}" "http://localhost:3000$p")
            echo "$code $p $(wc -c < /tmp/out.html) bytes"
            if [ "$code" -ge 500 ]; then fail=1; tail -c 2000 /tmp/out.html; fi
          done
          # First destination, itinerary and theme detail pages from the sitemap
          for u in $(curl -s http://localhost:3000/sitemap.xml | grep -o 'https\?://[^<]*/\(destinations\|itineraries\|experiences\)/[^<]*' | sed 's#https\?://[^/]*##' | awk -F/ '!seen[$2]++'); do
            code=$(curl -s -o /tmp/out.html -w "%{http_code}" "http://localhost:3000$u"); echo "$code $u"; [ "$code" -ge 500 ] && fail=1
          done
          curl -s -H 'Cookie: thh_lang=en' http://localhost:3000/ | grep -o '<h1[^>]*>[^<]*' | head -2
          curl -s http://localhost:3000/ | grep -o '<h1[^>]*>[^<]*' | head -2
          curl -s http://localhost:3000/destinations | grep -o 'class="card"' | wc -l
          exit $fail
      - name: Account pages send visitors to login
        run: |
          for p in /account /account/cab /account/profile; do
            loc=$(curl -s -o /dev/null -w "%{redirect_url}" "http://localhost:3000$p")
            echo "$p -> $loc"; echo "$loc" | grep -q "/login?next=" || exit 1
          done
