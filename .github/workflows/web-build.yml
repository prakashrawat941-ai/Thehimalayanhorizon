# Checks the Next.js app (web/) on every pull request: production build.
name: Web build check
on:
  pull_request:
 ['web/**', '.github/workflows/**']
  workflow_dispatch:
concurrency:
  group: web-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  push:
    branches: [integration/thh-unified-baseline-v1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      THH_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.THH_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.THH_STAGING_SUPABASE_ANON_KEY }}
      THH_STAGING_PROJECT_REF: gboxcnxgdkcewstkxogt
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Require staging configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.THH_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.THH_STAGING_SUPABASE_ANON_KEY }}
        run: |
          test "$NEXT_PUBLIC_SUPABASE_URL" = 'https://gboxcnxgdkcewstkxogt.supabase.co'
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
      - run: npm run build
      - name: Smoke test pages (reads live public data only)
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          fail=0
          for p in / /destinations /villages /experiences /itineraries /homestays /village-tours /workspaces /contact /faq /about /our-story /blog /gallery /search /login /plan /cab /offline /sitemap.xml /robots.txt /manifest.webmanifest /sw.js /no-such-page /account /account/bookings /account/cab /account/trips /account/saved /account/reviews /account/notifications /account/profile "/plan?place=almora" "/plan?from=kumaon-village-trail" /t/not-a-real-token-1234; do
            code=$(curl -s -o /tmp/out.html -w "%{http_code}" "http://localhost:3000$p")
            echo "$code $p $(wc -c < /tmp/out.html) bytes"
            if [ "$code" -ge 500 ]; then fail=1; tail -c 2000 /tmp/out.html; fi
          done
          # First destination, itinerary and theme detail pages from the sitemap
          for u in $(curl -s http://localhost:3000/sitemap.xml | grep -o 'https\?://[^<]*/\(destinations\|itineraries\|experiences\)/[^<]*' | sed 's#https\?://[^/]*##' | awk -F/ '!seen[$2]++'); do
            code=$(curl -s -o /tmp/out.html -w "%{http_code}" "http://localhost:3000$u"); echo "$code $u"; [ "$code" -ge 500 ] && fail=1
          done
          curl -s -H 'Cookie: thh_lang=en' http://localhost:3000/ | grep -o '<h1[^>]*>[^<]*' | head -2
          curl -s http://localhost:3000/ | grep -o '<h1[^>]*>[^<]*' | head -2
          curl -s http://localhost:3000/destinations | grep -o 'class="card"' | wc -l
          exit $fail
      - name: Account pages send visitors to login
        run: |
          for p in /account /account/cab /account/profile /trips/00000000-0000-0000-0000-000000000000 /partner /partner/join /partner/calendar; do
            loc=$(curl -s -o /dev/null -w "%{redirect_url}" "http://localhost:3000$p")
            echo "$p -> $loc"; echo "$loc" | grep -q "/login?next=" || exit 1
          done
