<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THH public pages — HD design preview (demo data)</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1f4d3a;--pine-2:#2f6b4f;--pine-l:#e7f2ec;--glacier:#1d5f99;--glacier-2:#164b7a;--glacier-l:#eaf2fa;
  --snow:#fff;--mist:#f2f5f8;--ink:#17212b;--ink-2:#34414d;--muted:#5a6773;--line:#dde4ea;--amber:#9a5b00;--amber-l:#fdf1dc;
  --r:18px;--shadow:0 1px 2px rgba(23,33,43,.06),0 10px 28px rgba(23,33,43,.08);
  --font:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.6 var(--font);color:var(--ink);background:#e6ebef}
button{font:inherit;color:inherit}img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.15;margin:0;letter-spacing:-.01em}
a{color:var(--glacier)}
:focus-visible{outline:3px solid #d99a2b;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* preview controls */
.ctl{background:#1b2630;color:#e6edf2;padding:12px 14px;font-size:13px}
.ctl-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.ctl-badge{background:#d99a2b;color:#1b2630;font-weight:700;border-radius:6px;padding:2px 8px;font-size:12px}
.ctl-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ctl-group>span{color:#9fb0bd}
.ctl button{background:#2a3843;border:1px solid #3c4d5a;color:#e6edf2;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.ctl button[aria-pressed="true"]{background:#e6edf2;color:#1b2630;border-color:#e6edf2;font-weight:600}
.stage{padding:16px 0 40px}.frame-label{text-align:center;font-size:12px;color:var(--muted);margin:0 0 10px}
.frame{margin:0 auto;background:#fbfcfd;container-type:inline-size;container-name:app;overflow:hidden;position:relative}
.stage.m .frame{width:360px;border-radius:28px;box-shadow:0 0 0 10px #1b2630,0 20px 50px rgba(0,0,0,.25)}
.stage.d .frame{max-width:1240px;border-radius:14px;box-shadow:var(--shadow)}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{width:36px;height:34px;object-fit:contain;mix-blend-mode:multiply;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--pine);line-height:1.1;display:block}
.brand small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav{display:none;gap:4px;margin:0 auto}
.nav button{border:0;background:none;padding:8px 10px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
.nav button[aria-current="page"]{background:var(--pine-l);color:var(--pine);font-weight:600}
.top-acts{display:flex;gap:8px;align-items:center;margin-left:auto}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.top .signin{display:none}
@container app (min-width:980px){.nav{display:flex}.top-acts{margin-left:0}.top .signin{display:inline-flex}.top{padding:12px 28px}}
.tabbar{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(31,77,58,.06)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 10px;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer;min-height:58px}
.tabbar button[aria-current="page"]{color:var(--pine)}
.tabbar svg{width:22px;height:22px}
@container app (min-width:980px){.tabbar{display:none}}

/* shared */
.wrap{padding:0 16px}
@container app (min-width:760px){.wrap{padding:0 28px}}
@container app (min-width:1100px){.wrap{padding:0 max(28px,calc((100cqi - 1120px)/2))}}
.sec{margin:36px 0}
@container app (min-width:760px){.sec{margin:56px 0}}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h2{font-size:24px}
@container app (min-width:760px){.head h2{font-size:30px}}
.head p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--glacier);text-decoration:none;background:none;border:0;cursor:pointer;padding:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--pine);color:#fff;font-weight:700;padding:12px 20px;min-height:46px;cursor:pointer;text-decoration:none;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--pine-2)}
.btn.blue{background:var(--glacier)}.btn.blue:hover{background:var(--glacier-2)}
.btn.light{background:#fff;color:var(--pine)}
.btn.ghost{background:transparent;color:var(--pine);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.ghost-w{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8)}
.muted{color:var(--muted)}.small{font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.demo{background:var(--amber-l);color:var(--amber);border:1px dashed #e0a33a}
.tag.green{background:var(--pine-l);color:var(--pine)}.tag.blue{background:var(--glacier-l);color:var(--glacier-2)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@container app (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@container app (min-width:980px){.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,78%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.hscroll>*{scroll-snap-align:start;min-width:0}
@container app (min-width:980px){.hscroll{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible}}

/* hero */
.hero{position:relative;color:#fff;min-height:400px;display:flex;align-items:flex-end;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,30,45,.05) 0%,rgba(10,30,45,.35) 35%,rgba(10,30,45,.88) 100%)}
.hero h1,.hero p{text-shadow:0 1px 12px rgba(5,20,32,.45)}
.hero-in{position:relative;z-index:1;width:100%;padding-top:80px;padding-bottom:48px}
.hero .eyebrow{color:#d8e8f4}
.hero h1{font-size:34px;color:#fff;max-width:14ch}
.hero p.lead{font-size:17px;color:#f2f7fb;margin:10px 0 18px;max-width:46ch}
.hero-acts{display:flex;gap:10px;flex-wrap:wrap}
@container app (min-width:760px){.hero{min-height:560px}.hero h1{font-size:56px}.hero p.lead{font-size:19px}.hero::after{background:linear-gradient(90deg,rgba(10,30,45,.86) 0%,rgba(10,30,45,.62) 42%,rgba(10,30,45,.08) 78%)}.hero-in{padding-bottom:64px}}
.search{position:relative;z-index:2;margin-top:-24px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:grid;gap:10px}
.search-field{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:50px;color:var(--muted)}
.search-field svg{flex:none;width:20px;height:20px;color:var(--glacier)}
.search-tabs{display:flex;gap:6px;overflow-x:auto}
.search-tabs button{border:0;border-radius:999px;padding:6px 12px;background:var(--mist);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.search-tabs button[aria-pressed="true"]{background:var(--glacier);color:#fff}
@container app (min-width:760px){.search{grid-template-columns:auto 1fr auto;align-items:center;margin-top:-36px;padding:14px 16px}}

/* tabbed search card */
.sc{position:relative;z-index:2;margin-top:-34px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(23,33,43,.14);padding:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#eef2f6;border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:none;border-radius:11px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-height:42px}
.seg button svg{width:17px;height:17px;flex:none}
.seg button[aria-selected="true"]{background:#fff;color:var(--pine);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sf{display:grid;gap:8px}
.sf .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.in2{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:50px;color:var(--muted);font-size:15px;background:#fff;min-width:0}
.in2 svg{width:19px;height:19px;flex:none;color:var(--glacier)}
.in2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .btn{width:100%;margin-top:2px}
@container app (min-width:900px){
  .sc{margin-top:-48px;padding:16px 18px}
  .seg{max-width:420px}
  .sf{grid-template-columns:1.6fr 1fr 1fr auto;align-items:center}
  .sf .row{display:contents}
  .sc .btn{width:auto;margin:0;padding:0 26px;min-height:50px}
}
/* services row */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.svc button{border:0;background:none;cursor:pointer;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);line-height:1.2}
.svc i{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.svc i svg{width:26px;height:26px}
@container app (min-width:900px){.svc{max-width:640px;margin:0 auto}.svc i{width:68px;height:68px}.svc button{font-size:14px}}
/* theme photo cards */
.tscroll{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.tscroll>*{scroll-snap-align:start;min-width:0}
.tcard{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;color:#fff;display:flex;align-items:flex-end;text-decoration:none;cursor:pointer;border:0;padding:0;background:#cfdbe5;text-align:left}
.tcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,24,36,.78))}
.tcard b{position:relative;z-index:1;padding:10px;font-size:14.5px;font-weight:600;line-height:1.25}
@container app (min-width:760px){.tscroll{grid-auto-columns:30%}}
@container app (min-width:1000px){.tscroll{grid-auto-flow:row;grid-template-columns:repeat(6,1fr);overflow:visible}.tcard b{font-size:15px}}
/* quick actions */
.qa-row{display:grid;gap:12px;grid-template-columns:1fr}
@container app (min-width:760px){.qa-row{grid-template-columns:repeat(3,1fr)}}
.qa{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;cursor:pointer;width:100%}
.qa img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.qa b{display:block;font-size:16px}.qa span{font-size:13.5px;color:var(--muted)}
.qa .go{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--glacier-l);color:var(--glacier);display:flex;align-items:center;justify-content:center;flex:none}

/* theme pills */
.themes{display:flex;gap:8px;flex-wrap:wrap}
.theme{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;cursor:pointer}
.theme:hover{border-color:var(--pine-2)}

/* photo card */
.pc{position:relative;border-radius:var(--r);overflow:hidden;background:#cfdbe5;aspect-ratio:3/2;color:#fff;display:flex;align-items:flex-end;text-decoration:none}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,24,36,.82))}
.pc .pc-b{position:relative;z-index:1;padding:14px;width:100%}
.pc b{font-family:var(--display);font-size:21px;font-weight:500;display:block}
.pc span{font-size:13.5px;opacity:.92}
.pc .tag{position:absolute;top:12px;left:12px;z-index:1}
.pc.noimg{background:linear-gradient(160deg,#cfe0ee,#d8ebdf)}
.pc.noimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6b8296;font-size:13px;font-weight:600}
.pc.noimg::after{background:linear-gradient(180deg,transparent 40%,rgba(8,24,36,.7))}

/* listing card */
.lc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.lc-m{position:relative;aspect-ratio:16/10;background:#cfdbe5;overflow:hidden}
.lc-m img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lc-m .tag{position:absolute;top:10px;left:10px}
.lc-b{padding:14px;display:grid;gap:4px;flex:1}
.lc-b h3{font-size:19px}
.lc-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px;color:var(--muted)}
.lc-f{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 14px;background:#fbfcfd}
.lc-f b{font-size:18px}

/* bands */
.band{background:linear-gradient(180deg,#eef5f1,#f6faf8);padding:36px 0}
@container app (min-width:760px){.band{padding:64px 0}}
.split{display:grid;gap:22px;align-items:center}
@container app (min-width:900px){.split{grid-template-columns:1fr 1fr;gap:48px}}
.split-img{border-radius:22px;overflow:hidden;aspect-ratio:16/10}
.split-img img{width:100%;height:100%;object-fit:cover}
.split h2{font-size:28px}
@container app (min-width:760px){.split h2{font-size:38px}}
.split h2 em{font-style:italic;color:var(--pine-2)}
.lead{font-size:17px;color:var(--ink-2)}
.feats{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin:18px 0}
.feat{display:flex;gap:10px;align-items:flex-start}
.feat i{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-style:normal;color:var(--pine)}
.feat b{display:block;font-size:14.5px}.feat span{font-size:13px;color:var(--muted)}
.cab-promo{background:var(--glacier-2);color:#fff;border-radius:24px;padding:24px;display:grid;gap:16px;position:relative;overflow:hidden}
.cab-promo h2{color:#fff;font-size:26px}
.cab-promo ol{margin:0;padding-left:20px;display:grid;gap:6px;opacity:.95}
@container app (min-width:900px){.cab-promo{grid-template-columns:1.2fr .8fr;align-items:center;padding:40px}}
.cab-promo .seats{display:grid;grid-template-columns:repeat(3,38px);gap:6px;justify-content:center;background:rgba(255,255,255,.1);border-radius:20px;padding:16px}
.cab-promo .seats i{height:42px;border-radius:9px 9px 6px 6px;border:2px solid rgba(255,255,255,.75)}
.cab-promo .seats i.sel{background:#7fd1a6;border-color:#7fd1a6}.cab-promo .seats i.drv{background:#0d2f4d;border-color:#0d2f4d}.cab-promo .seats i.gap{border:0}
.culture{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.culture .pc{aspect-ratio:4/5}
.culture .pc b{font-size:17px}
@container app (min-width:900px){.culture{grid-template-columns:repeat(3,1fr);gap:16px}.culture .pc{aspect-ratio:4/3}.culture .pc b{font-size:21px}}
.seasons{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,44%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
@container app (min-width:900px){.seasons{grid-auto-flow:row;grid-template-columns:repeat(5,1fr)}}
.season{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/2;color:#fff;scroll-snap-align:start}
.season img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.season::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,24,36,.8))}
.season span{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;font-size:13px}
.season b{display:block;font-family:var(--display);font-size:18px;font-weight:500}
.why{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@container app (min-width:900px){.why{grid-template-columns:repeat(4,1fr)}}
.why div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.why b{display:block;margin:6px 0 2px}.why span{font-size:13.5px;color:var(--muted)}
.closing{border-radius:24px;overflow:hidden;position:relative;color:#fff;padding:32px 22px;display:grid;gap:14px}
.closing>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.closing::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,50,38,.9),rgba(15,50,38,.55))}
.closing>*:not(img){position:relative;z-index:1}
.closing h2{color:#fff;font-size:28px;max-width:18ch}
@container app (min-width:900px){.closing{padding:56px;grid-template-columns:1fr auto;align-items:center}.closing h2{font-size:40px}}
.soft{background:#fff;border:1px dashed #c9d5df;border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.soft b{display:block;color:var(--ink);font-family:var(--display);font-weight:500;font-size:19px;margin-bottom:4px}
.soft .btn{margin-top:10px}

/* page head */
.ph{position:relative;color:#fff;overflow:hidden;min-height:220px;display:flex;align-items:flex-end}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,30,45,.15),rgba(10,30,45,.8))}
.ph .wrap{position:relative;z-index:1;padding-top:40px;padding-bottom:22px;width:100%}
.ph h1{color:#fff;font-size:30px}.ph p{margin:6px 0 0;opacity:.94;max-width:56ch}
.ph .eyebrow{color:#d8e8f4}
@container app (min-width:900px){
  .ph{min-height:0;color:var(--ink);background:linear-gradient(180deg,#eef5f1,#f6faf8);display:block}
  .ph::after{display:none}
  .ph .wrap{display:grid;grid-template-columns:1fr minmax(0,520px);gap:40px;align-items:center;padding-top:40px;padding-bottom:56px}
  .ph>img{display:none}.ph .ph-img{display:block}
  .ph h1{color:var(--ink);font-size:46px}.ph .eyebrow{color:var(--muted)}.ph p{color:var(--ink-2)}
}
.ph-img{display:none;border-radius:22px;overflow:hidden;aspect-ratio:16/10}
.ph-img img{width:100%;height:100%;object-fit:cover}
.filters{display:grid;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:-22px 0 18px;position:relative;z-index:2;box-shadow:var(--shadow)}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.fgrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fgrid label{font-size:13px;font-weight:600;color:var(--ink-2)}
.fgrid .in{display:block;margin-top:3px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;color:var(--muted);font-weight:400;background:#fff}
@container app (min-width:760px){.fgrid{grid-template-columns:repeat(3,1fr) auto;align-items:end}}
.count{font-size:14px;color:var(--muted);margin:0 0 12px}

/* info pages */
.prose{max-width:66ch;font-size:17px;color:var(--ink-2)}
.prose p{margin:0 0 14px}
.placeholder{background:repeating-linear-gradient(135deg,#fbfcfd 0 10px,#f3f6f9 10px 20px);border:1.5px dashed #c9d5df;border-radius:14px;padding:16px;color:var(--muted)}
.values{display:grid;gap:12px;grid-template-columns:1fr}
@container app (min-width:760px){.values{grid-template-columns:repeat(3,1fr)}}
.values div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.values b{display:block;font-family:var(--display);font-weight:500;font-size:19px;margin:6px 0 4px}
.contact{display:grid;gap:12px;grid-template-columns:1fr}
@container app (min-width:760px){.contact{grid-template-columns:1fr 1fr}}
.cc{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.cc i{width:42px;height:42px;border-radius:12px;background:var(--glacier-l);color:var(--glacier);display:flex;align-items:center;justify-content:center;flex:none;font-style:normal}
.cc b{display:block}.cc span{font-size:14.5px;color:var(--ink-2);overflow-wrap:anywhere}
.map{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#e7eef3;aspect-ratio:16/9;position:relative}
.map svg{width:100%;height:100%}
.map .pin{position:absolute;left:52%;top:46%;transform:translate(-50%,-100%);background:var(--pine);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}

footer.ft{background:#13261e;color:#cfe0d7;padding:32px 0 24px;margin-top:40px}
.ft-grid{display:grid;gap:18px;grid-template-columns:1fr 1fr}
@container app (min-width:900px){.ft-grid{grid-template-columns:2fr 1fr 1fr 1fr}}
.ft b{color:#fff;display:block;margin-bottom:6px}
.ft a,.ft button{display:block;color:#cfe0d7;text-decoration:none;font-size:14px;padding:3px 0;background:none;border:0;cursor:pointer;text-align:left}
.ft small{display:block;margin-top:20px;font-size:12px;color:#93a99d}

  S[g.dataset.group] = b.dataset.v;
  if (g.dataset.group === 'frame') { document.getElementById('stage').className = 'stage ' + S.frame; document.getElementById('frameLabel').textContent = S.frame === 'm' ? 'Mobile frame · 360px wide' : 'Desktop frame · up to 1240px wide'; }

document.addEventListener('click', (e) => {

});

      <button class="btn" data-go="homestays">${t('homestays')} ${svg.arrow}</button></div>
    <div class="split-img"><img src="${IMG.village}" alt=""></div></div></section>
  <section class="wrap sec">${head('', t('stays_h'), t('stays_p'), 'homestays')}
    ${live() ? soft(t('empty_stays'), t('empty_stays_p'), t('partner_b')) : `<div class="grid g3">${STAYS.map(stayCard).join('')}</div>`}</section>
  <section class="wrap sec"><div class="split">
    <div class="split-img"><img src="${IMG.balcony}" alt="A laptop on a wooden balcony desk facing forested Himalayan valleys"></div>
    <div><p class="eyebrow">${t('work_e')}</p><h2>${t('work_h')}</h2><p class="lead">${t('work_p')}</p>
      <div class="feats">${[['📶','w_wifi','w_wifi_s'],['🪑','w_desk','w_desk_s'],['🌿','w_calm','w_calm_s']].map(([i,a,b]) => `<div class="feat"><i aria-hidden="true">${i}</i><span><b>${t(a)}</b><span>${t(b)}</span></span></div>`).join('')}</div>
      <button class="btn ghost" data-go="workations">${t('workations')} ${svg.arrow}</button></div></div></section>
  <section class="wrap sec"><div class="cab-promo">
    <div><p class="eyebrow" style="color:#bcd7ee">${t('cab_e')}</p><h2>${t('cab_h')}</h2><ol style="margin-top:12px"><li>${t('cab_1')}</li><li>${t('cab_2')}</li><li>${t('cab_3')}</li></ol>
      <div style="margin-top:16px"><button class="btn light">${t('find_ride')} ${svg.arrow}</button></div></div>
    <div class="seats" aria-hidden="true"><i></i><i class="gap"></i><i class="drv"></i><i class="sel"></i><i></i><i class="sel"></i><i></i><i class="gap"></i><i></i></div></div></section>
  <section class="wrap sec">${head(t('culture_e'), t('culture_h'))}<div class="culture">
    ${[['thali','c_food'],['aipan','c_aipan'],['doli','c_fest'],['bells','c_temple'],['plate','c_craft'],['walk','c_walk']].map(([im,k]) => `<a class="pc" href="#explore" data-go="explore"><img src="${IMG[im]}" alt=""><span class="pc-b"><b>${t(k)}</b><span>${t(k+'_s')}</span></span></a>`).join('')}</div></section>
  <section class="wrap sec"><p class="eyebrow">${t('seasons_e')}</p><div class="seasons">
    ${['spring','summer','monsoon','autumn','winter'].map((s) => `<div class="season"><img src="${IMG[s]}" alt=""><span><b>${t('s_'+s)}</b>${t('s_'+s+'_s')}</span></div>`).join('')}</div></section>
  <section class="wrap sec">${head(t('why_e'), '')}<div class="why">
    ${[['🏔️','y_local'],['✅','y_honest'],['🗺️','y_plan'],['🛡️','y_safe']].map(([i,k]) => `<div><span aria-hidden="true" style="font-size:22px">${i}</span><b>${t(k)}</b><span>${t(k+'_s')}</span></div>`).join('')}</div></section>
  <section class="wrap sec"><div class="closing"><img src="${IMG.kumaon}" alt=""><div><h2>${t('cta_h')}</h2><p style="margin:8px 0 0;opacity:.92">${t('cta_p')}</p></div><button class="btn light">${t('plan_trip')} ${svg.arrow}</button></div></section>
  <section class="wrap sec"><div class="soft" style="text-align:left;display:grid;gap:8px;border-style:solid"><b>${t('partner_h')}</b><span>${t('partner_p')}</span><div><button class="btn">${t('partner_b')}</button></div></div></section>`;
}

function explore(){
  let list = live() ? PLACES.filter((p) => !p.img) : PLACES;
  list = list.filter((p) => (!S.region || p.region === S.region) && (!S.kind || p.kind === S.kind) && (!S.theme || p.theme === S.theme));
  const pill = (name, v, label) => `<button class="pill" data-filter="${name}" data-v="${v}" aria-pressed="${S[name]===v}">${label}</button>`;
  return `<section class="ph"><img src="${IMG.kumaon}" alt=""><div class="wrap"><div><p class="eyebrow">${t('places_e')}</p><h1>${t('exp_h')}</h1><p>${t('exp_p')}</p></div><div class="ph-img"><img src="${IMG.kumaon}" alt=""></div></div></section>
  <div class="wrap"><div class="filters">
    <div class="search-field">${svg.search}<span>${t('search_ph')}</span></div>
    <div class="pills" role="group" aria-label="Region">${pill('region','',t('all'))}${pill('region','Garhwal',t('garhwal'))}${pill('region','Kumaon',t('kumaon'))}</div>
    <div class="pills" role="group" aria-label="Kind">${pill('kind','',t('all'))}${pill('kind','village',t('villages'))}${pill('kind','destination',t('destinations'))}${pill('kind','town',t('towns'))}</div>
    <div class="pills" role="group" aria-label="Theme">${pill('theme','',t('all'))}${THEMES.map(([ic,en,hi,slug]) => pill('theme',slug,`${ic} ${S.lang==='hi'?hi:en}`)).join('')}</div></div>
    <p class="count">${list.length} ${t('results')}${live() ? ' · live today' : ''}</p>
    ${list.length ? `<div class="grid g3">${list.map(placeCard).join('')}</div>` : soft(t('empty_places'), t('empty_places_p'))}
    <div class="sec">${soft(t('partner_h'), t('partner_p'), t('partner_b'))}</div></div>`;
}

function listingPage(kind){
  const isStay = kind === 'homestays';
  const rows = live() ? [] : (isStay ? STAYS : WORKS);
  return `<section class="ph"><img src="${IMG[isStay ? 'village' : 'balcony']}" alt=""><div class="wrap"><div><p class="eyebrow">${isStay ? t('stay_e') : t('work_e')}</p><h1>${isStay ? t('homestays') : t('wk_h')}</h1><p>${isStay ? t('hs_p') : t('wk_p')}</p></div><div class="ph-img"><img src="${IMG[isStay ? 'village' : 'balcony']}" alt=""></div></div></section>
  <div class="wrap">
    ${rows.length ? `<div class="filters"><div class="fgrid"><label>${t('district')}<span class="in">${t('any')}</span></label><label>${t('max_price')}<span class="in">₹</span></label>${isStay ? `<label>${t('guests')}<span class="in">2</span></label>` : '<span></span>'}<button class="btn">${t('filter')}</button></div></div>
      <p class="count">${rows.length} ${isStay ? t('homestays').toLowerCase() : t('workations').toLowerCase()}</p><div class="grid g3">${rows.map(isStay ? stayCard : workCard).join('')}</div>`
      : `<div style="margin-top:18px">${isStay ? soft(t('empty_stays'), t('empty_stays_p'), t('partner_b')) : soft(t('empty_work'), t('empty_work_p'), t('partner_b'))}</div>`}
    ${!isStay ? `<section class="sec"><div class="feats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${[['📶','w_wifi','w_wifi_s'],['🪑','w_desk','w_desk_s'],['🌿','w_calm','w_calm_s']].map(([i,a,b]) => `<div class="feat"><i aria-hidden="true">${i}</i><span><b>${t(a)}</b><span>${t(b)}</span></span></div>`).join('')}</div></section>` : ''}
  </div>`;
}

function story(){
  const body = live() ? soft(t('empty_page'), t('empty_page_p'))
    : `<div class="placeholder"><span class="tag demo">${t('demo')}</span><p style="margin:8px 0 0">[ Placeholder: the owner writes the real story in Admin → CMS → Pages → “Our Story”. Paragraphs appear here exactly as written. No story text is invented by the site. ]</p></div>`;
  return `<section class="ph"><img src="${IMG.village}" alt=""><div class="wrap"><div><p class="eyebrow">${t('story_e')}</p><h1>${t('story_h')}</h1><p>${t('tagline')}</p></div><div class="ph-img"><img src="${IMG.village}" alt=""></div></div></section>
  <div class="wrap sec"><div class="split" style="align-items:start"><div class="prose">${body}</div>
    <div class="split-img"><img src="${IMG.doli}" alt=""></div></div></div>
  <section class="wrap sec">${head(t('why_e'), '')}<div class="values">
    ${[['🏔️','y_local'],['✅','y_honest'],['🛡️','y_safe']].map(([i,k]) => `<div><span aria-hidden="true" style="font-size:22px">${i}</span><b>${t(k)}</b><span class="muted small">${t(k+'_s')}</span></div>`).join('')}</div></section>`;
}

function office(){
  const v = (k) => live() ? `<span>From Admin → Settings → Contact (<b style="display:inline">${k}</b>)</span>` : `<span>[${k} from settings] <span class="tag demo">${t('demo')}</span></span>`;
  return `<section class="ph"><img src="${IMG.road}" alt=""><div class="wrap"><div><p class="eyebrow">${t('office_e')}</p><h1>${t('office_h')}</h1></div><div class="ph-img"><img src="${IMG.road}" alt=""></div></div></section>
  <div class="wrap sec"><div class="split" style="align-items:start">
    <div class="contact">
      <div class="cc"><i aria-hidden="true">📍</i><div><b>${t('address')}</b>${v('address')}</div></div>
      <div class="cc"><i aria-hidden="true">📞</i><div><b>${t('phone')}</b>${v('phone')}</div></div>
      <div class="cc"><i aria-hidden="true">💬</i><div><b>${t('whatsapp')}</b>${v('whatsapp')}</div></div>
      <div class="cc"><i aria-hidden="true">✉️</i><div><b>${t('email')}</b>${v('email')}</div></div>
    </div>
    <div><div class="map"><svg viewBox="0 0 400 225" aria-hidden="true"><rect width="400" height="225" fill="#e3ecf2"/><path d="M0 160 C80 140 120 180 200 150 S320 110 400 130" stroke="#c5d6e3" stroke-width="18" fill="none"/><path d="M40 0 L120 225 M260 0 L220 225 M0 70 L400 90" stroke="#fff" stroke-width="6"/><path d="M0 60 C60 40 100 70 160 50 S280 20 400 40" stroke="#cfe2d4" stroke-width="30" fill="none" opacity=".7"/></svg><span class="pin">📍 THH</span></div>
      <p class="muted small" style="margin:8px 0 14px">${t('map_note')}</p>
      <div class="soft" style="text-align:left;border-style:solid"><b>${t('write')}</b><span>Name, phone, message → saved to the database (existing contact form).</span><div><button class="btn blue">${t('write')}</button></div></div></div>
  </div></div>`;
}

function render(){
  chrome();
  const html = { home, explore, homestays:() => listingPage('homestays'), workations:() => listingPage('workations'), story, office }[S.page]();
  const app = document.getElementById('app'); app.innerHTML = html;
}
const h0 = location.hash.slice(1); if (PAGES.includes(h0)) S.page = h0;
render();
</script>
</body>
</html>
