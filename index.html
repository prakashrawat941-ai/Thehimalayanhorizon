  <link rel="icon" href="icons/signature-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/signature-apple-touch-icon.png">

  <link rel="stylesheet" href="css/app.css?v=17">
  <script type="module" src="js/app.js"></script>
  <style>
    #thh-launch { position:fixed; inset:0; z-index:99999; display:grid; place-content:center; justify-items:center; gap:16px; background:white; color:#14303d; pointer-events:none }
    #thh-launch .mark { display:grid; width:clamp(96px,27vw,160px) }
    #thh-launch img { grid-area:1 / 1; width:100%; mix-blend-mode:multiply }
    #thh-launch img:first-child { animation:thh-fade 250ms ease both }
    #thh-launch img:last-child { animation:thh-reveal 300ms 250ms ease both }
    #thh-launch span { font:500 clamp(19px,5vw,28px) Georgia,serif; animation:thh-fade 300ms 550ms ease both }
    @keyframes thh-fade { from { opacity:0 } to { opacity:1 } }
    @keyframes thh-reveal { from { clip-path:inset(0 100% 0 0) } to { clip-path:inset(0) } }
  </style>
</head>
<body>
  <template id="launch-template">
    <div id="thh-launch" aria-hidden="true">
      <div class="mark"><img src="icons/signature-ridge.png" alt=""><img src="icons/signature-hill.png" alt=""></div>
      <span>The Himalayan Horizon</span>
    </div>
  </template>
  <script>
    (() => {
      if (!matchMedia('(display-mode: standalone)').matches && !navigator.standalone) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (location.search || !['', '#', '#/'].includes(location.hash)) return;
      if (performance.getEntriesByType('navigation')[0]?.type !== 'navigate') return;
      try {
        if (sessionStorage.getItem('thh-launched')) return;
        sessionStorage.setItem('thh-launched', '1');
      } catch { return; }
      const screen = document.querySelector('#launch-template').content.firstElementChild.cloneNode(true);
      document.body.prepend(screen);
      const dismiss = () => screen.remove();
      setTimeout(dismiss, 850);
      window.addEventListener('pagehide', dismiss, { once:true });
    })();
  </script>
  <a class="skip" href="#main">Skip to content</a>
  <div id="shell"></div>
  <main id="main" tabindex="-1"></main>
  <div id="foot"></div>
  <div id="tabs"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">Please enable JavaScript to use this website.</p></noscript>
</body>
</html>
